controller_manager:
  ros__parameters:
    update_rate: 50 # 频率建议 50Hz-100Hz

    # 定义控制器名称
    mecanum_controller:
      type: mecanum_drive_controller/MecanumDriveController

    # 用于发布所有 joint 状态，Rviz 显示必选
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

mecanum_controller:
  ros__parameters:
    reference_timeout: 0.6 # 超时时间，单位秒
    
    # 1. 关节指令接口名称映射（Jazzy/Humble新版要求）
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"

    # 2. 接口类型配置
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

    kinematics:
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      wheels_radius: 0.07162
      sum_of_robot_center_projection_on_X_Y_axis: 0.2555


    # 3. 坐标系设置
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true # 是否发布 odom 到 base_footprint 的变换
