ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true        # 【关键】因为是平面运动，忽略所有 Z 轴数据
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 1. 订阅 mecanum_controller 发布的原始里程计
    odom0: /mecanum_controller/odometry
    # 配置矩阵: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # 我们只信任底盘解算出来的线速度 (vx, vy)
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # 2. 订阅 IMU 数据
    imu0: /imu
    # 我们信任 IMU 测量出来的绝对航向角 (yaw) 和 角速度 (vyaw)
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true